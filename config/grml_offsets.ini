; Intro logo timer gate (skips 3Division / Hooded Horse logo wait while loading):
;   +24: `74 38` (`je +0x38` when no key/mouse pressed) -> NOP to auto-advance logo timer
intro_skip_aob = 48 8B 4F 08 BA 10 00 00 00 48 8B 89 E0 06 00 00 FF 15 ?? ?? ?? ?? 84 C0 74 38 F3 0F 10 87 84 01 00 00 F3 0F 10 0D ?? ?? ?? ?? 0F 2F C8 76 0C
intro_skip_je_off = 24

