; ============================================================================
; grml_offsets.ini — Glorious Republic Mod Loader (GRML) Signatures & Builds
; ============================================================================
; All wildcarded AOB patterns and version fingerprints live here so game
; hotfixes can be patched externally without recompiling grml_runtime.dll.
; Every AOB requires exact single match (count == 1) across .text; if an
; optional pattern misses, GRML logs its exact name and disables only that
; feature instead of crashing SOVIET64.exe.
; ============================================================================

[signatures]
; In-game vs Main-Menu flag probe (verified count==1 on 1.2.0.8 and 1.2.0.9)
;   +15: RIP-relative disp32 to g_inGameFlag (next IP at +19)
in_game_flag_aob = 48 8D 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 44 38 35 ?? ?? ?? ?? 0F 84 ?? ?? ?? ?? 48 8D 0D ?? ?? ?? ?? E8
in_game_flag_disp_off = 15
in_game_flag_next_ip_off = 19

; ResourceGet anchor string (RML API v1 semantic symbol `wrsr.resource_get`)
; Verified count==1 on 1.1.1.7, 1.1.1.9, 1.2.0.8, 1.2.0.9
resource_get_anchor = ResourceGet - not found %s

; Main-menu version line format string (UTF-16LE anchor for safe LEA disp32 tag)
; Verified count==1 on 1.1.1.9, 1.2.0.8, 1.2.0.9
menu_version_fmt_wide = v%d.%d.%d.%d (64 bit DX11.1 - GPU: %ls)

; C3DDLL64.dll Workshop forwarding exports hooked via SOVIET64.exe IAT
workshop_load_export = ?C3DPath_WorkshopForwardLoadItems@@YAXPEAD@Z
workshop_add_export = ?C3DPath_WorkshopForwardAddItem@@YAX_KPEAD@Z
workshop_save_export = ?C3DPath_WorkshopForwardSaveItems@@YAXPEAD@Z

; World-market ResourceVector & ResourceRecord stride lookup:
;   +14: RIP-relative disp32 to ResourceVector (next IP at +18)
;   +45: imm32 stride inside `imul rax, r8, <stride>` (0x340 or 0x380)
price_table_aob = 48 C7 86 94 07 00 00 03 00 00 00 48 8D 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 49 3B C6 0F 84 ?? ?? ?? ?? 4C 63 86 98 07 00 00 49 8B C8 49 69 C0 ?? ?? 00 00 48 8B 15 ?? ?? ?? ??
price_table_vec_disp_off = 14
price_table_vec_next_ip_off = 18
price_table_stride_imm_off = 45

; EvaluateDistTask(GameObject*, Task0x80*) prologue (Road & Rail DOs):
dispatch_check_aob = 48 8B C4 48 89 58 08 55 56 57 41 54 41 55 41 56 41 57 48 8D 68 A1 48 81 EC 00 01 00 00

; Direct-to-Save Launch (MainMenuManager singleton, readiness & LoadSaveHeaderAndCheckItems):
;   main_menu_loop_aob: +3 disp32 -> g_menuActive (next IP +7), +52 disp32 -> g_mainMenuObj (next IP +56)
main_menu_loop_aob = 44 38 35 ?? ?? ?? ?? 74 ?? 48 8B 0D ?? ?? ?? ?? 41 83 C9 FF 41 B8 99 99 99 FF 48 8B 01 41 8D 51 04 FF 50 18 48 8B 0D ?? ?? ?? ?? 48 8B 01 FF 50 28 48 8D 0D ?? ?? ?? ?? E8
main_menu_active_disp_off = 3
main_menu_active_next_ip_off = 7
main_menu_obj_disp_off = 52
main_menu_obj_next_ip_off = 56

;   main_menu_uistate_aob: +2 disp32 -> uiState offset inside g_mainMenuObj (1=Main Menu, 2=Load Submenu)
main_menu_uistate_aob = 8B 87 74 50 00 00 83 F8 02 75 0D 48 8B CF E8 ?? ?? ?? ?? E9 ?? ?? ?? ?? 83 F8 06 75 0D
main_menu_uistate_imm_off = 2

;   load_save_header_aob: LoadSaveHeaderAndCheckItems(MainMenuObj* rcx, const SaveEntry* rdx)
load_save_header_aob = 40 55 53 57 41 54 41 55 41 56 48 8D AC 24 ?? ?? FF FF 48 81 EC ?? ?? 00 00 48 8B 05 ?? ?? ?? ?? 48 33 C4 48 89 85 ?? ?? 00 00 48 8B 81 50 0F 00 00 48 8D 99 78 0F 00 00 48 89 81 58 0F 00 00 4C 8D 82 04 01 00 00

;   load_save_trigger_aob: +11 disp32 -> g_loadRequested (next IP +16), +23 disp32 -> g_newGameFlag (next IP +28)
load_save_trigger_aob = 41 8B 86 78 50 00 00 FF C8 C6 05 ?? ?? ?? ?? 01 A9 FD FF FF FF C6 05 ?? ?? ?? ?? 00 0F 94 C0 41 88 86 C0 10 00 00
load_save_req_disp_off = 11
