; ============================================================================
; grml_offsets.ini — Glorious Republic Mod Loader (GRML) Signatures & Builds
; ============================================================================
; All wildcarded AOB patterns and version fingerprints live here so game
; hotfixes can be patched externally without recompiling grml_runtime.dll.
; Every AOB requires exact single match (count == 1) across .text; if an
; optional pattern misses, GRML logs its exact name and disables only that
; feature instead of crashing SOVIET64.exe.
; ============================================================================

[signatures]
; In-game vs Main-Menu flag probe (verified count==1 on 1.2.0.8 and 1.2.0.9)
;   +15: RIP-relative disp32 to g_inGameFlag (next IP at +19)
in_game_flag_aob = 48 8D 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 44 38 35 ?? ?? ?? ?? 0F 84 ?? ?? ?? ?? 48 8D 0D ?? ?? ?? ?? E8
in_game_flag_disp_off = 15
in_game_flag_next_ip_off = 19

; ResourceGet anchor string (RML API v1 semantic symbol `wrsr.resource_get`)
; Verified count==1 on 1.1.1.7, 1.1.1.9, 1.2.0.8, 1.2.0.9
resource_get_anchor = ResourceGet - not found %s

; Main-menu version line format string (UTF-16LE anchor for safe LEA disp32 tag)
; Verified count==1 on 1.1.1.9, 1.2.0.8, 1.2.0.9
menu_version_fmt_wide = v%d.%d.%d.%d (64 bit DX11.1 - GPU: %ls)

; C3DDLL64.dll Workshop forwarding exports hooked via SOVIET64.exe IAT
workshop_load_export = ?C3DPath_WorkshopForwardLoadItems@@YAXPEAD@Z
workshop_add_export = ?C3DPath_WorkshopForwardAddItem@@YAX_KPEAD@Z
workshop_save_export = ?C3DPath_WorkshopForwardSaveItems@@YAXPEAD@Z

