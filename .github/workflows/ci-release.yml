name: Build & Release GRML (Windows x64)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-x64:
    name: Build Release x64 (/MT + Deno Desktop)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Configure & Build Native C++20 (/MT)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          $script = @"
          @call "$vcvars" > nul 2>&1
          cmake -S "$PWD" -B "$PWD/build/release" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          if errorlevel 1 exit /b 1
          cmake --build "$PWD/build/release" -j
          if errorlevel 1 exit /b 1
          "@
          $bat = Join-Path $env:TEMP "grml_ci_build.bat"
          [IO.File]::WriteAllText($bat, $script, [Text.Encoding]::ASCII)
          & cmd.exe /c "`"$bat`""
          if ($LASTEXITCODE -ne 0) { throw "Native build failed" }

      - name: Build Deno Desktop Launcher
        shell: pwsh
        working-directory: launcher-ui
        run: |
          deno check main.ts
          deno desktop -A --include ui -o ../build/release/bin/GloriousRepublicModLoader main.ts

      - name: Package Release Archive
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -TotalCount 1).Trim()
          $stage = "build/stage/GRML-v$ver-win64"
          New-Item -ItemType Directory -Force -Path "$stage/plugins" | Out-Null
          Copy-Item "build/release/bin/grml_injector.exe" $stage
          Copy-Item "build/release/bin/grml_runtime.dll" $stage
          Copy-Item "build/release/bin/grml.ini" $stage
          Copy-Item -Recurse "build/release/bin/GloriousRepublicModLoader/*" $stage
          Copy-Item "LICENSE" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "build/GRML-v$ver-win64.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grml-win64-release
          path: |
            build/GRML-v*-win64.zip

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/GRML-v*-win64.zip
          generate_release_notes: true
